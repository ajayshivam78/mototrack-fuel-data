name: Update fuel prices

on:
  schedule:
    - cron: "15 1,7,13,19 * * *"   # 06:45, 12:45, 18:45, 00:45 India time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Read prices
        run: python scripts/update_prices.py

      - name: Save prices.json
        if: always()
        run: |
          git config user.name "fuel-bot"
          git config user.email "fuel-bot@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || (git commit -m "Update fuel prices" && git push)